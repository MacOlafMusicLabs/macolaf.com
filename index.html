<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MacOlaf Music Labs</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Light Mode: Pure Black Text on Pure White Background */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #ffffff;
      color: #000000;
      padding: 1.5rem;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      text-align: center;
      max-width: 520px;
      width: 100%;
    }

    /* Primary Title: Original Modern Sans-Serif Stack */
    .brand-title {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    /* Subtitle: Original Sans-Serif Stack */
    .brand-subtitle {
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      opacity: 1;
      margin-top: 1.5rem;
    }

    .logo {
      max-width: 280px;
      width: 100%;
      height: auto;
      display: block;
      margin: 1.5rem auto;
    }

    /* Secondary Action Link */
    .shop-link {
      display: inline-block;
      margin-top: 2.5rem;
      padding: 0.6rem 1.25rem;
      border: 1px solid currentColor;
      color: inherit;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 4px;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .shop-link:hover {
      opacity: 0.7;
      transform: translateY(-1px);
    }

    /* Dark Mode: Pure White Text on Pure Black Background */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #000000;
        color: #ffffff;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="brand-title">MacOlaf</h1>
    
    <!-- Automatic Dark/Light Mode Logo Switching -->
    <picture>
      <!-- Served in Dark Mode (Pure Black Background) -->
      <source srcset="logo-light.png" media="(prefers-color-scheme: dark)">
      
      <!-- Fallback / Light Mode (Pure White Background) -->
      <img src="logo-dark.png" alt="MacOlaf Music Labs Logo" class="logo">
    </picture>

    <p class="brand-subtitle">Music Labs</p>

    <!-- Secondary Action Link -->
    <a href="https://shop.macolaf.com" class="shop-link" target="_blank" rel="noopener">
      Shop Merch &rarr;
    </a>
  </div>
</body>
</html>
